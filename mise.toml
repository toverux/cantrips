# https://mise.jdx.dev -- Your dev environment, prepped and ready
# Tip: Use "mise t"(asks) to list tasks or "mise r"(un) to interactively select one to run!
#
# This repository has no build (see AGENTS.md): the tasks here are dogfooding conveniences, never
# a step an edit has to go through. Each one is a thin wrapper over a script in scripts/.
#
# Every task is bash plumbing, so each pins bash: mise defaults to cmd on Windows.
# Flags reach a script through a separator: `mise run dev:fork-diff -- --refresh`.

[tools]
# jq reads the Claude Code plugin registry in scripts/sync-install.sh; gh fetches upstream files in
# scripts/fork-diff.sh. Logging gh in stays the user's job — the script only checks and says so.
jq = "1.8"
gh = "2"

# DEVELOPMENT TASKS
# =================

[tasks."dev:sync-install"]
description = "Mirror this working tree over the installed copies of cantrips (Claude Code and Codex CLI), so uncommitted edits are dogfooded from other projects without a release."
shell = "bash -c"
run = "./scripts/sync-install.sh"

[tasks."dev:fork-diff"]
description = "Report how far each forked skill has drifted from the upstream release its source: frontmatter pins. Takes skill names, --tag <tag> and --refresh; reports and never gates."
shell = "bash -c"
run = "./scripts/fork-diff.sh"

[tasks."dev:mod-preview"]
description = "Start a detached tmux session (cantrips-mod) running Claude Code on this working tree with the loop panel mod loaded and the project setting source only; the engine reloads the mod on each save, and tmux capture-pane reads the pane as text."
shell = "bash -c"
run = "./scripts/mod-preview.sh"

[tasks."dev:mod-shot"]
description = "Render the preview pane to the PNG at the path given; --full keeps the chat, --target names the session."
shell = "bash -c"
# uv runs the script, fetching the Pillow and fontTools its inline metadata names.
tools = { uv = "0" }
run = "./scripts/mod-shot.py"

[tasks.test]
description = "Run the tests of the scripts shipped inside skills and of the mod's pure core under node --test, then the mod's mounted scenarios under claude plugin test; they gate nothing."
shell = "bash -c"
run = "./scripts/test.sh"
